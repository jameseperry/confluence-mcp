[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.2.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "markdownify>=0.14.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
confluence-mcp = "confluence_mcp.server:main"
